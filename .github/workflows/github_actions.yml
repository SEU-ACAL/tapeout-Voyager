name: Voyager CI
run-name: ${{ github.actor }} is running CI Test 🚀
on: [push]
jobs:
  Code-Join:
    name: Code Pull
    runs-on: ubuntu-20.04
    steps:
      - name: Print information
        run: | 
          echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
          echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Pull from the repository
        run: |
          ssh -p 10000 CI_runner@43.153.184.168 -o StrictHostKeyChecking=no << 'EOF'
          source ~/.zshrc
          chipyard_exec
          git pull origin ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "🍏 pull from repository ${{ job.status }}."
      - name: Verify pre-commit proof
        run: |
          PROOF_FILE=".pre-commit-proof"
          if [ ! -f "$PROOF_FILE" ]; then
            echo "Error: pre-commit proof file not found!"
            exit 1
          fi
          CURRENT_COMMIT_HASH=$(git rev-parse HEAD)
          CURRENT_FILE_HASH=$(git diff HEAD^ HEAD | sha256sum | cut -d ' ' -f1)
          STORED_HASH=$(cat $PROOF_FILE)
          STORED_COMMIT_HASH=$(echo $STORED_HASH | cut -d ':' -f1)
          STORED_FILE_HASH=$(echo $STORED_HASH | cut -d ':' -f2)
          if [ "$CURRENT_COMMIT_HASH" != "$STORED_COMMIT_HASH" ] || [ "$CURRENT_FILE_HASH" != "$STORED_FILE_HASH" ]; then
            echo "Error: pre-commit SHA-256 hash mismatch!"
            exit 1
          fi
      - run: echo "🍏 pre-commit proof verification is ${{ job.status }}."

  Compile-lint:
    name: Compile Lint
    runs-on: ubuntu-20.04
    needs: Code-Join
    steps:
      - name: Build Workloads
        run: |
          ssh -p 10000 CI_runner@43.153.184.168 -o StrictHostKeyChecking=no << 'EOF'
          source ~/.zshrc
          chipyard_exec
          cd software
          mkdir -p build && cd build 
          cmake ..
          make build-all
      - run: echo "🍏 Workloads build test is ${{ job.status }}."
        # 如果检查失败，强制回退分支
      - name: Revert Bad Commit
        if: failure()
        run: |
          ssh -p 10000 CI_runner@43.153.184.168 -o StrictHostKeyChecking=no << 'EOF'
          source ~/.zshrc
          chipyard_exec
          git reset --hard HEAD~1
          git push --force origin ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Verilator
        run: |
          ssh -p 10000 CI_runner@43.153.184.168 -o StrictHostKeyChecking=no << 'EOF'
          source ~/.zshrc
          chipyard_exec
          ./software/scripts/build-verilator.sh --config OurHeterSoCConfig
      - run: echo "🍏 Verilator build test is ${{ job.status }}."
        # 如果检查失败，强制回退分支
      - name: Revert Bad Commit
        if: failure()
        run: |
          ssh -p 10000 CI_runner@43.153.184.168 -o StrictHostKeyChecking=no << 'EOF'
          source ~/.zshrc
          chipyard_exec
          git reset --hard HEAD~1
          git push --force origin ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Test-Workloads:
    name: Test Workloads
    runs-on: ubuntu-20.04
    needs: Compile-lint
    steps:
      - name: Run mini-test on runner machine
        run: |
          ssh -p 10000 CI_runner@43.153.184.168 -o StrictHostKeyChecking=no << 'EOF'
          source ~/.zshrc
          chipyard_exec
          ./software/scripts/run-verilator.sh --config OurHeterSoCConfig hello 
      - run: echo "🍏 mini-test on runner machine is ${{ job.status }}."
        # 如果检查失败，强制回退分支
      - name: Revert Bad Commit
        if: failure()
        run: |
          ssh -p 10000 CI_runner@43.153.184.168 -o StrictHostKeyChecking=no << 'EOF'
          source ~/.zshrc
          chipyard_exec
          git reset --hard HEAD~1
          git push --force origin ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Update-Repository:
    name: Update Repository
    runs-on: ubuntu-20.04
    needs: Test-Workloads
    steps:
      - run: echo "🎉 Good Job! This ${{ github.event_name }} will be updated to ${{ github.ref }}."