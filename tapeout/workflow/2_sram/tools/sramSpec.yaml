# SRAM Memory Compiler规格配置
# 定义不同bank数量和mux配置下的word和bits限制

sram_specs:
  # 单Bank配置
  - bank_count: 1
    mux: 4
    min_words: 64
    max_words: 1024
    min_bits: 4
    max_bits: 144
    word_step: 16
    bit_step: 1
    
  - bank_count: 1
    mux: 8
    min_words: 128
    max_words: 2048
    min_bits: 4
    max_bits: 72
    word_step: 16
    bit_step: 1
    
  # 双Bank配置
  - bank_count: 2
    mux: 4
    min_words: 1024
    max_words: 2048
    min_bits: 4
    max_bits: 144
    word_step: 16
    bit_step: 1
    
  - bank_count: 2
    mux: 8
    min_words: 2048
    max_words: 4096
    min_bits: 4
    max_bits: 72
    word_step: 32
    bit_step: 1
    
  # 四Bank配置  
  - bank_count: 4
    mux: 4
    min_words: 2048
    max_words: 4096
    min_bits: 4
    max_bits: 72
    word_step: 16
    bit_step: 1
    
  - bank_count: 4
    mux: 8
    min_words: 4096
    max_words: 8192
    min_bits: 4
    max_bits: 72
    word_step: 32
    bit_step: 1
