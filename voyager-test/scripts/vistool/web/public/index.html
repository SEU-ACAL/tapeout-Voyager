<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyager Logo Demo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        
        .logo {
            font-size: 5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00c6ff, #0072ff, #3a7bd5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(0, 114, 255, 0.3);
            position: relative;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        .logo::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00c6ff, transparent);
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(0, 114, 255, 0.3);
            }
            to {
                text-shadow: 0 0 20px rgba(0, 114, 255, 0.6), 
                             0 0 30px rgba(0, 114, 255, 0.4);
            }
        }
    </style>
</head>
<body>
    <div class="logo">Voyager</div>
</body>
</html>
